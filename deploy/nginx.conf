server {
    listen 80;
    server_name planner.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name planner.example.ru;
    ssl_certificate /etc/letsencrypt/live/planner.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planner.example.ru/privkey.pem;
    client_max_body_size 6m;

    location = /api/maintenance {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:6553;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
